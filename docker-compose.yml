name: plugindev

services:
  db:
    image: mysql:8.0
    container_name: plugindev_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:latest
    container_name: plugindev_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: '1'
      PUKAT_VITE_DEV_SERVER: http://localhost:3000
      PUKAT_PDF_RENDERER_URL: http://pdf-renderer:3001/render
    volumes:
      - .:/var/www/html
      - wp_uploads:/var/www/html/wp-content/uploads
    networks:
      - wordpress_network
      - pdf_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: plugindev_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
    networks:
      - wordpress_network

  pdf-renderer:
    build: ./wp-content/plugins/Pukat/tools/pdf-renderer
    container_name: plugindev_pdf_renderer
    restart: unless-stopped
    init: true
    shm_size: '256mb'
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pdf_network

  node:
    image: node:20-alpine
    container_name: plugindev_node
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - wordpress
    environment:
      VITE_PORT: 3000
      VITE_WP_PROXY_TARGET: http://wordpress
    ports:
      - "3000:3000"
    volumes:
      - ./wp-content/plugins/Pukat/pukat-app:/app
      - pukat_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    networks:
      - wordpress_network

volumes:
  db_data:
  wp_uploads:
  pukat_node_modules:

networks:
  wordpress_network:
    driver: bridge
  pdf_network:
    driver: bridge
    internal: true
