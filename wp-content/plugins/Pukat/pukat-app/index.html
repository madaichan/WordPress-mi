<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pukat dev harness (temporary — QA only)</title>
    <script>
      // Dev-harness twin of Pukat\Core\ThemeBoot — pre-applies the stored
      // theme so the harness does not flash the wrong one either.
      try {
        var stored = null
        try { stored = window.localStorage.getItem('pukat:theme') } catch (e) {}
        var dark = stored === 'dark' || (
          stored !== 'light' &&
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        )
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}

      window.PukatData = {
        context: new URLSearchParams(location.search).get('admin') ? 'admin' : 'frontend',
        user: { id: 1, displayName: 'QA Tester', email: 'qa@example.com', role: 'pukat_admin' },
        restUrl: 'http://localhost:39999/wp-json/pukat/v1',
        nonce: '',
      }
    </script>
  </head>
  <body>
    <div id="pukat-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
